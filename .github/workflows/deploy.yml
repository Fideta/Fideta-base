name: Deploy Docusaurus + Pagefind to GitHub Pages

on:
  push:
    branches: [ sources ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Docusaurus
        run: npm run build

      - name: Sanity check: HTML exists
        run: |
          echo "== Count HTML files in build =="
          find build -type f -name "*.html" | wc -l
          echo "== First few HTML files =="
          find build -type f -name "*.html" | head -n 30

      - name: Pagefind version
        run: npx -y pagefind@1.3.0 --version

      # ✅ écriture explicite dans build/pagefind + FR + logs verbeux
      - name: Generate Pagefind index (FR → build/pagefind)
        run: |
          npx -y pagefind@1.3.0 \
            --site build \
            --force-language fr \
            --glob "**/*.{html}" \
            --output-path "$GITHUB_WORKSPACE/build/pagefind" \
            --verbose

      - name: Show Pagefind output
        run: |
          echo "== ls build/pagefind =="
          ls -la build/pagefind || true
          echo "== manifest head =="
          if [ -f build/pagefind/manifest.json ]; then
            head -c 1500 build/pagefind/manifest.json | sed 's/}/}\n/g'
          else
            echo "manifest.json missing"
          fi

      - name: Assert Pagefind index exists
        run: |
          test -f build/pagefind/manifest.json || (echo "❌ Missing build/pagefind/manifest.json" && exit 1)
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('build/pagefind/manifest.json','utf8'));console.log('✅ Pagefind pages:', j.pages, 'languages:', Object.keys(j.languages||{}));"

      - name: Upload artifact (build/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
